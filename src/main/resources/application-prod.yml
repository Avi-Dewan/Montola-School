spring:
  datasource:
    url: ${DB_URL}?sslmode=require
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      # Never hold an idle connection open. Neon drops connections when it suspends,
      # and maintaining a minimum-idle connection makes the pool reconnect, which
      # wakes the compute again — the exact loop that exhausts the free allowance.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  jpa:
    hibernate:
      # Flyway owns the schema in production, so skip boot-time validation: it is
      # a stack of metadata round-trips against a remote (and often suspended)
      # database. It also lets a deploy succeed while Neon is out of quota.
      ddl-auto: none

# API docs are a development tool; generating them costs startup time and memory.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  frontend-url: ${FRONTEND_URL}
