spring:
  datasource:
    url: ${DB_URL}?sslmode=require
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      # Never hold an idle connection open. Neon drops connections when it suspends,
      # and maintaining a minimum-idle connection makes the pool reconnect, which
      # wakes the compute again — the exact loop that exhausts the free allowance.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 240000
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  jpa:
    hibernate:
      ddl-auto: validate

app:
  frontend-url: ${FRONTEND_URL}
