spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/montola
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  # Dev now runs the same migrations as prod so the schemas cannot drift.
  # An existing dev database (created before Flyway was enabled here) is baselined
  # at V12, so only V13+ are applied to it; a fresh database gets the full V1..Vn run.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 12

  jpa:
    hibernate:
      ddl-auto: validate

app:
  frontend-url: http://localhost:3000

  # Development-only demo data. Runs on startup when the dev profile is active and
  # the database has not been seeded yet. Never active on a deployed instance —
  # that runs the prod profile (see the Dockerfile), and this class is @Profile("dev").
  dev:
    seed: true
    # Password for every seeded account. Local development only: this file is in a
    # public repository, and these accounts only ever exist in a local database.
    seed-password: ${DEV_SEED_PASSWORD:Montola098#}
