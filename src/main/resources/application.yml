spring:
  application:
    name: montola

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:60}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_APP_EMAIL}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true