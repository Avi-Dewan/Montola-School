server:
  port: ${PORT:8080}

spring:
  application:
    name: montola
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:60}

  resend:
    api-key: ${RESEND_API_KEY}

  servlet:
    multipart:
      # Spring's default is 1MB, which would reject real PDFs and video files.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:30MB}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    # external = keep the stored reference as-is (e.g. a Google Drive id).
    # s3       = serve private files through presigned URLs (AWS S3 or any
    #            S3-compatible provider such as Cloudflare R2).
    provider: ${STORAGE_PROVIDER:external}
    s3:
      # Blank = real AWS S3. For R2 use
      # https://<account-id>.r2.cloudflarestorage.com with region "auto".
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style: ${AWS_S3_PATH_STYLE:true}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-south-1}
      url-ttl-seconds: ${STORAGE_URL_TTL_SECONDS:300}
      prefix: ${AWS_S3_PREFIX:shop/}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /internal
  endpoint:
    health:
      show-details: never