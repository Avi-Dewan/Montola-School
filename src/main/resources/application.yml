spring:
  application:
    name: montola

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:60}
