server:
  port: ${PORT:8080}

spring:
  application:
    name: montola
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:60}

  resend:
    api-key: ${RESEND_API_KEY}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /internal
  endpoint:
    health:
      show-details: never