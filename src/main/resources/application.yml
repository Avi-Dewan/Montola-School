server:
  port: ${PORT:8080}

spring:
  application:
    name: montola
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET}
      expiration-minutes: ${SECURITY_JWT_EXPIRATION_MINUTES:60}

  resend:
    api-key: ${RESEND_API_KEY}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  storage:
    # external = keep the stored reference as-is (e.g. a Google Drive id).
    # s3       = serve shop product files from a private S3 bucket via presigned URLs.
    provider: ${STORAGE_PROVIDER:external}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-south-1}
      url-ttl-seconds: ${STORAGE_URL_TTL_SECONDS:300}
      prefix: ${AWS_S3_PREFIX:shop/}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /internal
  endpoint:
    health:
      show-details: never
  health:
    # Health checks must NOT query the database. Neon's free tier scales to zero
    # after 5 minutes of inactivity and the timer is reset by any query, so a
    # 5-minute uptime ping against a db-backed health check keeps the database
    # awake 24/7 and burns the whole monthly compute allowance.
    # Database connectivity is still proven by Flyway/Hibernate at startup and by
    # every real request.
    db:
      enabled: false