services:
  db:
    image: postgres:16-alpine
    container_name: montola_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - montola_db_data:/var/lib/postgresql/data

volumes:
  montola_db_data:
